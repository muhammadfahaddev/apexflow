name: Bug Report
description: Report a bug in ApexFlow
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please fill out the form below.
        
        ⚠️ **Security issue?** Do NOT use this form. See [SECURITY.md](../SECURITY.md).

  - type: input
    id: version
    attributes:
      label: ApexFlow Version
      placeholder: "e.g. v0.1.0"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Web (browser)
        - Android (Expo)
        - iOS (Expo)
        - Self-hosted (Docker)
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Clear description of what went wrong.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Go to...
        2. Click on...
        3. See error...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: true

  - type: dropdown
    id: ai_provider
    attributes:
      label: AI Provider
      options:
        - Gemini (default)
        - OpenAI
        - Claude
        - Ollama (local)
        - Custom

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: Any error messages or console output (remove sensitive data)
      render: shell
